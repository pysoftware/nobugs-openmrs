name: "OpenMRS Setup"
description: "Start OpenMRS and wait for SPA"

runs:
  using: "composite"
  steps:
    - name: Start OpenMRS and wait for SPA
      shell: bash
      run: |
        docker compose up -d --wait
        echo "Waiting for OpenMRS SPA to load (up to 10 hours)..."

        # Запускаем Node.js скрипт через npx playwright, чтобы дождаться поля username
        npx playwright wait-for-selector "input[name='username']" \
          --timeout $((10*60*60*1000)) \
          --url http://localhost/openmrs/spa

        echo "OpenMRS SPA is ready!"