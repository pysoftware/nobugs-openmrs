name: "OpenMRS Setup"
description: "Start OpenMRS and wait for SPA"

runs:
  using: "composite"
  steps:
    - name: Start OpenMRS and wait for SPA
      shell: bash
      run: |
        docker compose up -d --wait
        echo "Waiting for OpenMRS SPA to load (up to 10 hours)..."
        node .github/actions/wait-for-openmrs-session.js