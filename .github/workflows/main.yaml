name: Run tests

on:
  # На любой push (коммит) в любой ветку
  push:
    branches:
      - '**'  # Все ветки
    paths-ignore:
      - '**.md'  # Не запускать на изменения в документации
      - '.gitignore'

  # На pull request
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone and start OpenMRS Reference Application (no demo)
        run: |
          git clone --depth 1 https://github.com/openmrs/openmrs-distro-referenceapplication.git o3-refapp
          cd o3-refapp
      
          mkdir -p openmrs-data
      
          cat > openmrs-data/openmrs-runtime.properties << 'EOL'
          connection.url=jdbc:mysql://db:3306/openmrs?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          connection.username=openmrs
          connection.password=openmrs
          auto_update_database=true
          add_demo_data=false
          EOL
      
          docker compose pull --quiet || true
          docker compose up -d
      
          echo "Контейнеры:"
          docker compose ps
      
          echo "Ожидание полной инициализации (до 60 минут)..."
          timeout 3600 bash -c '
          until curl -s -f -u admin:Admin123 http://localhost/openmrs/ws/rest/v1/systeminformation >/dev/null; do
          echo "Ждём OpenMRS... $(date +%H:%M:%S)"
          sleep 15
          done
          ' || {
            echo "!!! TIMEOUT — OpenMRS не готов за 60 минут"
            echo "Логи backend (последние 400 строк):"
            docker compose logs --tail=400 backend
            echo "Логи db:"
            docker compose logs --tail=100 db
            echo "Логи gateway:"
            docker compose logs --tail=100 gateway
            exit 1
          }
      
          echo "OpenMRS 3.x успешно инициализирован!"


      # ────────────────────────────────────────────────
      # Java + Maven для обоих типов тестов
      # ────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven repository # Кэширование репозитория Maven для ускорения сборки
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        continue-on-error: true
        run: |
          chmod +x mvnw
          echo "Список файлов wrapper:"
          ls -la mvnw .mvn/wrapper/ || echo "mvnw или wrapper не найдены"
          echo "Версия Maven от wrapper:"
          ./mvnw --version
          echo "Запуск тестов..."
          ./mvnw clean test

      - name: Run Swagger Coverage
        continue-on-error: true
        if: ${{ inputs.package == 'api' }}
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s https://o3.openmrs.org/openmrs/module/webservices/rest/swagger.json \
          -i target/swagger-coverage-output \
          --auth-basic admin:Admin123

      # Сохраняем Swagger Report в артефакты GitHub Actions
      - name: Save Swagger Coverage
        uses: actions/upload-artifact@v4
        if: ${{ inputs.package == 'api' }}
        with:
          name: swagger-coverage
          path: |
            swagger-coverage-report.html
            swagger-coverage-results.json
      # Загружаем историю Allure Report с специальной ветки gh-pages (https://allurereport.org/docs/integrations-github/)
      - name: Load test report history
        uses: actions/checkout@v2
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: target/allure-results
          subfolder: ${{ inputs.package }}

      # Создаем пустую ветку gh-pages на основе инструкции https://gist.github.com/ramnathv/2227408
      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history