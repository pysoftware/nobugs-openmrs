name: Run tests

on:
  # На любой push (коммит) в любой ветку
  push:
    branches:
      - '**'  # Все ветки
    paths-ignore:
      - '**.md'  # Не запускать на изменения в документации
      - '.gitignore'

  # На pull request
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone and start OpenMRS Reference Application (no volumes)
        run: |
            git clone --depth 1 https://github.com/openmrs/openmrs-distro-referenceapplication.git o3-distro
            cd o3-distro
            
            # Используем вариант без volume (быстрее и чище в CI)
            docker compose -f docker-compose-no-volumes.yml pull --quiet || true
            docker compose -f docker-compose-no-volumes.yml up -d
            
            docker compose -f docker-compose-no-volumes.yml ps
          
          echo "Ожидаем готовности OpenMRS (без жёсткого лимита времени)..."
          echo "Проверяем каждые 10 сек, пока /session не вернёт authenticated: true"
            
            until curl -s -f -u admin:Admin123 http://localhost/openmrs/ws/rest/v1/session | grep -q '"authenticated":true'; do
            echo "Ещё ждём OpenMRS... $(date '+%H:%M:%S')"
            sleep 10
            done
          
          echo "OpenMRS готов! /session возвращает JSON с authenticated: true"

      - name: Show backend & db logs on failure
        if: failure()
        run: |
          docker compose logs backend
          docker compose logs db


      # ────────────────────────────────────────────────
      # Java + Maven для обоих типов тестов
      # ────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven repository # Кэширование репозитория Maven для ускорения сборки
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        continue-on-error: true
        run: |
          chmod +x mvnw
          echo "Список файлов wrapper:"
          ls -la mvnw .mvn/wrapper/ || echo "mvnw или wrapper не найдены"
          echo "Версия Maven от wrapper:"
          ./mvnw --version
          echo "Запуск тестов..."
          ./mvnw clean test

      - name: Run Swagger Coverage
        continue-on-error: true
        if: ${{ inputs.package == 'api' }}
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s https://o3.openmrs.org/openmrs/module/webservices/rest/swagger.json \
          -i target/swagger-coverage-output \
          --auth-basic admin:Admin123

      # Сохраняем Swagger Report в артефакты GitHub Actions
      - name: Save Swagger Coverage
        uses: actions/upload-artifact@v4
        if: ${{ inputs.package == 'api' }}
        with:
          name: swagger-coverage
          path: |
            swagger-coverage-report.html
            swagger-coverage-results.json
      # Загружаем историю Allure Report с специальной ветки gh-pages (https://allurereport.org/docs/integrations-github/)
      - name: Load test report history
        uses: actions/checkout@v2
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: target/allure-results
          subfolder: ${{ inputs.package }}

      # Создаем пустую ветку gh-pages на основе инструкции https://gist.github.com/ramnathv/2227408
      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
