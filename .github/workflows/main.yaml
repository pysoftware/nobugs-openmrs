name: Run tests

on:
  # На любой push (коммит) в любой ветку
  push:
    branches:
      - '**'  # Все ветки
    paths-ignore:
      - '**.md'  # Не запускать на изменения в документации
      - '.gitignore'

  # На pull request
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone and start OpenMRS Reference Application
        shell: bash
        run: |
          docker compose up -d --wait
          curl -I http://localhost/openmrs/spa

      - name: Wait for OpenMRS to be fully ready
        run: |

          echo "→ Final check: attempting login as admin (infinite retries)..."

          while true; do
              SESSION=$(curl -s -X POST -d "username=admin&password=Admin123" \
                  http://localhost/openmrs/ws/rest/v1/session | jq -r .sessionId 2>/dev/null)

              if [ -n "$SESSION" ] && [ "$SESSION" != "null" ]; then
                  echo "→ Login OK (sessionId получен) → OpenMRS ready for tests!"
                  exit 0
              fi

              echo "Login failed! $(date +%H:%M:%S)"
              sleep 60
          done
      #      - name: Wait for OpenMRS to be ready
      #        run: |
      #          timeout 900s bash -c '
      #            until curl -s -f -o /dev/null http://localhost/openmrs; do
      #              echo "Waiting backend... $(date +%H:%M:%S)"
      #              sleep 5
      #            done
      #            until curl -s -f -o /dev/null http://localhost/openmrs/spa; do
      #              echo "Waiting SPA... $(date +%H:%M:%S)"
      #              sleep 5
      #            done
      #          ' || { echo "Timeout"; docker compose -f refapp/docker-compose.yml ps; exit 1; }
      #          echo "OpenMRS ready"

      # ────────────────────────────────────────────────
      # Java + Maven для обоих типов тестов
      # ────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven repository # Кэширование репозитория Maven для ускорения сборки
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Playwright browsers
        run: |
          chmod +x mvnw .mvn/wrapper/mvnw* 2>/dev/null || true
          ./mvnw dependency:go-offline
          java -cp "$(./mvnw dependency:build-classpath -q -Dmdep.outputFile=cp.txt && cat cp.txt)" \
            com.microsoft.playwright.CLI install --with-deps chromium

      - name: Run tests
        continue-on-error: true
        run: |
          chmod +x mvnw
          echo "Список файлов wrapper:"
          ls -la mvnw .mvn/wrapper/ || echo "mvnw или wrapper не найдены"
          echo "Версия Maven от wrapper:"
          ./mvnw --version
          echo "Запуск тестов..."
          ./mvnw clean test

      - name: Run Swagger Coverage
        continue-on-error: true
        if: ${{ inputs.package == 'api' }}
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s https://o3.openmrs.org/openmrs/module/webservices/rest/swagger.json \
          -i target/swagger-coverage-output \
          --auth-basic admin:Admin123

      # Сохраняем Swagger Report в артефакты GitHub Actions
      - name: Save Swagger Coverage
        uses: actions/upload-artifact@v4
        if: ${{ inputs.package == 'api' }}
        with:
          name: swagger-coverage
          path: |
            swagger-coverage-report.html
            swagger-coverage-results.json
      # Загружаем историю Allure Report с специальной ветки gh-pages (https://allurereport.org/docs/integrations-github/)
      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: target/allure-results
          subfolder: ${{ inputs.package }}

      # Создаем пустую ветку gh-pages на основе инструкции https://gist.github.com/ramnathv/2227408
      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history