name: Run tests

on:
  # На любой push (коммит) в любой ветку
  push:
    branches:
      - '**'  # Все ветки
    paths-ignore:
      - '**.md'  # Не запускать на изменения в документации
      - '.gitignore'

  # На pull request
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone and start OpenMRS Reference Application
        run: |
          # Клонируем официальный репозиторий
          git clone https://github.com/openmrs/openmrs-distro-referenceapplication.git refapp
          cd refapp

          # Создаём директорию для данных (чтобы volume её подхватил)
          mkdir -p openmrs-data

          # Создаём файл конфигурации с отключением demo-данных
          cat > openmrs-data/openmrs-runtime.properties << 'EOF'
          # Основные настройки подключения к БД
          connection.url=jdbc:mysql://db:3306/openmrs?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          connection.driver_class=com.mysql.cj.jdbc.Driver
          connection.username=openmrs
          connection.password=openmrs

          # Автоматическое создание и обновление БД
          auto_update_database=true
          create_tables=true

          # КРИТИЧНО: отключаем генерацию демо-данных, чтобы избежать ошибки в ReferenceDemoDataActivator
          add_demo_data=false

          # Дополнительные флаги отключения demo-генерации (на всякий случай)
          referencedemodata.enabled=false
          referencedemodata.createDemoPatientsOnNextStartup=0
          referencedemodata.createDemoVisitsOnNextStartup=0
          referencedemodata.createDemoEncountersOnNextStartup=0
          referencedemodata.createDemoObsOnNextStartup=0

          # Разрешаем веб-админку модулей
          module.allow_web_admin=true

          # Можно добавить другие настройки, если нужно
          # Например: admin_password=Admin123 (но по умолчанию уже Admin123)
          EOF

          # Debug: показываем содержимое файла (чтобы убедиться, что он создался)
          echo "Содержимое openmrs-runtime.properties:"
          cat openmrs-data/openmrs-runtime.properties
          echo "-------------------------------------"

          # Pull образов заранее (ускоряет запуск)
          docker compose pull --quiet || true

          # Запускаем стек
          docker compose up -d

          # Debug: проверяем, что контейнеры запустились
          docker compose ps


      # ────────────────────────────────────────────────
      # Java + Maven для обоих типов тестов
      # ────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven repository # Кэширование репозитория Maven для ускорения сборки
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        continue-on-error: true
        run: |
          chmod +x mvnw
          echo "Список файлов wrapper:"
          ls -la mvnw .mvn/wrapper/ || echo "mvnw или wrapper не найдены"
          echo "Версия Maven от wrapper:"
          ./mvnw --version
          echo "Запуск тестов..."
          ./mvnw clean test

      - name: Run Swagger Coverage
        continue-on-error: true
        if: ${{ inputs.package == 'api' }}
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s http://$HOST:8111/app/rest/swagger.json -i target/swagger-coverage-output

      # Сохраняем Swagger Report в артефакты GitHub Actions
      - name: Save Swagger Coverage
        uses: actions/upload-artifact@v4
        if: ${{ inputs.package == 'api' }}
        with:
          name: swagger-coverage
          path: |
            swagger-coverage-report.html
            swagger-coverage-results.json
      # Загружаем историю Allure Report с специальной ветки gh-pages (https://allurereport.org/docs/integrations-github/)
      - name: Load test report history
        uses: actions/checkout@v2
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: target/allure-results
          subfolder: ${{ inputs.package }}

      # Создаем пустую ветку gh-pages на основе инструкции https://gist.github.com/ramnathv/2227408
      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
