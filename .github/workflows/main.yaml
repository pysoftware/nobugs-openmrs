name: Run tests

on:
  # На любой push (коммит) в любой ветку
  push:
    branches:
      - '**'  # Все ветки
    paths-ignore:
      - '**.md'  # Не запускать на изменения в документации
      - '.gitignore'

  # На pull request
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone and start OpenMRS Reference Application (no demo)
        run: |
          echo "=== Этап 1: Клонируем репозиторий ==="
          git clone --depth 1 https://github.com/openmrs/openmrs-distro-referenceapplication.git o3-refapp || { echo "Ошибка: git clone провалился"; exit 1; }
          cd o3-refapp
      
          echo "=== Этап 2: Проверяем наличие docker-compose.yml ==="
          ls -l docker-compose.yml || { echo "Ошибка: docker-compose.yml не найден"; exit 1; }
      
          echo "=== Этап 3: Создаём директорию для данных ==="
          mkdir -p openmrs-data || { echo "Ошибка: не удалось создать openmrs-data"; exit 1; }
      
          echo "=== Этап 4: Создаём runtime.properties (минимизируем демо) ==="
          cat > openmrs-data/openmrs-runtime.properties << 'EOL'
          connection.url=jdbc:mysql://db:3306/openmrs?autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          connection.username=openmrs
          connection.password=openmrs
          auto_update_database=true
          add_demo_data=false
          EOL
      
          test -s openmrs-data/openmrs-runtime.properties || { echo "Ошибка: runtime.properties пустой или не создан"; exit 1; }
      
          echo "=== Этап 5: Pull образов ==="
          docker compose pull --quiet || { echo "Ошибка: docker compose pull провалился"; exit 1; }
      
          echo "=== Этап 6: Запускаем стек ==="
          docker compose up -d || { echo "Ошибка: docker compose up -d провалился"; exit 1; }
      
          echo "=== Этап 7: Проверяем, что все контейнеры стартовали (не в статусе Exited) ==="
          sleep 10  # даём 10 сек на запуск
          docker compose ps --format '{{.Name}} {{.State}}' | grep -v "running\|healthy" && { echo "Ошибка: некоторые контейнеры не в running/healthy состоянии"; docker compose ps; exit 1; } || echo "Все контейнеры в ожидаемом состоянии"
      
          echo "=== Этап 8: Ожидание полной готовности backend + Initializer (до 60 минут) ==="
          echo "Порт 8080 обычно не экспонируется → проверяем через gateway (localhost:80 /openmrs/...)"
          timeout 3600 bash -c '
          ATTEMPT=0
          until curl -s -f -u admin:Admin123 http://localhost/openmrs/ws/rest/v1/systeminformation >/dev/null; do
          ATTEMPT=$((ATTEMPT+1))
          echo "Попытка $ATTEMPT | Ждём OpenMRS... $(date +%H:%M:%S)"
          sleep 15
          done
          ' || {
            echo "!!! Ошибка: OpenMRS не готов за 60 минут"
            echo "Последние логи backend:"
            docker compose logs --tail=400 backend
            echo "Логи db (последние 150 строк):"
            docker compose logs --tail=150 db
            echo "Статус контейнеров:"
            docker compose ps
            exit 1
          }
      
          echo "=== Этап 9: Финальная проверка — получаем системную информацию ==="
          curl -s -u admin:Admin123 http://localhost/openmrs/ws/rest/v1/systeminformation > systeminfo.json || { echo "Ошибка: не удалось получить systeminformation после таймаута"; exit 1; }
      
          echo "OpenMRS успешно запущен!"
          echo "Версия (из systeminfo):"
          grep -E "version|build" systeminfo.json || echo "(не удалось распарсить версию)"


      # ────────────────────────────────────────────────
      # Java + Maven для обоих типов тестов
      # ────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven repository # Кэширование репозитория Maven для ускорения сборки
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run tests
        continue-on-error: true
        run: |
          chmod +x mvnw
          echo "Список файлов wrapper:"
          ls -la mvnw .mvn/wrapper/ || echo "mvnw или wrapper не найдены"
          echo "Версия Maven от wrapper:"
          ./mvnw --version
          echo "Запуск тестов..."
          ./mvnw clean test

      - name: Run Swagger Coverage
        continue-on-error: true
        if: ${{ inputs.package == 'api' }}
        run: .swagger-coverage-commandline/bin/swagger-coverage-commandline -s https://o3.openmrs.org/openmrs/module/webservices/rest/swagger.json \
          -i target/swagger-coverage-output \
          --auth-basic admin:Admin123

      # Сохраняем Swagger Report в артефакты GitHub Actions
      - name: Save Swagger Coverage
        uses: actions/upload-artifact@v4
        if: ${{ inputs.package == 'api' }}
        with:
          name: swagger-coverage
          path: |
            swagger-coverage-report.html
            swagger-coverage-results.json
      # Загружаем историю Allure Report с специальной ветки gh-pages (https://allurereport.org/docs/integrations-github/)
      - name: Load test report history
        uses: actions/checkout@v2
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          gh_pages: gh-pages
          allure_history: allure-history
          allure_results: target/allure-results
          subfolder: ${{ inputs.package }}

      # Создаем пустую ветку gh-pages на основе инструкции https://gist.github.com/ramnathv/2227408
      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history