name: Run tests

on:
  # На любой push (коммит) в любой ветку
  push:
    branches:
      - '**'  # Все ветки
    paths-ignore:
      - '**.md'  # Не запускать на изменения в документации
      - '.gitignore'

  # На pull request
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Подъём OpenMRS — общий для api и ui
      - name: Clone and start OpenMRS Reference Application
        run: |
          git clone https://github.com/openmrs/openmrs-distro-referenceapplication.git refapp
          cd refapp
          
          # Создаём openmrs-runtime.properties с автоматической настройкой
          mkdir -p data  # если volume не создаст автоматически
          cat > data/openmrs-runtime.properties << 'EOF'
          # Базовые настройки для автоматического старта
          connection.url=jdbc:mysql://db:3306/openmrs?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=UTC
          connection.driver_class=com.mysql.cj.jdbc.Driver
          connection.username=openmrs
          connection.password=openmrs
          auto_update_database=true
          create_tables=true
          add_demo_data=false          # false — чтобы быстрее (можно true, если нужны demo-пациенты)
          module.allow_web_admin=true
          EOF
          
          # Запускаем
          docker compose pull --quiet || true
          docker compose up -d
          
      - name: Wait for OpenMRS to be fully ready
        run: |
          timeout 900s bash -c '
          set -euo pipefail
          
          echo "Waiting for backend basic availability..."
          until curl -s -f -o /dev/null http://localhost/openmrs; do
           echo "Backend not yet responding... $(date +%H:%M:%S)"
           sleep 5
          done
          echo "Backend responds (Tomcat up)"
          
          echo "Waiting for SPA..."
          until curl -s -f -o /dev/null http://localhost/openmrs/spa; do
           echo "SPA not yet responding... $(date +%H:%M:%S)"
           sleep 5
          done
          echo "SPA responds"
          
          echo "Waiting for session endpoint (core ready)..."
          until curl -s -f http://localhost/openmrs/ws/rest/v1/session | grep -q '"authenticated": false'; do
           echo "Session not ready yet... $(date +%H:%M:%S)"
           sleep 8
          done
          echo "Session endpoint ready (OpenMRS core initialized)"
          
          echo "Waiting for concepts loaded (demo data / DB fully ready)..."
          until curl -s http://localhost/openmrs/ws/rest/v1/concept | grep -q '"results"'; do
           echo "Concepts not loaded yet... $(date +%H:%M:%S)"
           sleep 10
          done
          echo "Concepts endpoint returns results → application fully ready!"
      
          ' || {
          echo "Timeout — OpenMRS not fully ready after 15 min"
          docker compose -f refapp/docker-compose.yml ps
          docker compose -f refapp/docker-compose.yml logs backend | tail -n 50
          exit 1
          }
      
          echo "OpenMRS is fully ready!"

#      - name: Wait for OpenMRS to be ready
#        run: |
#          timeout 900s bash -c '
#            until curl -s -f -o /dev/null http://localhost/openmrs; do
#              echo "Waiting backend... $(date +%H:%M:%S)"
#              sleep 5
#            done
#            until curl -s -f -o /dev/null http://localhost/openmrs/spa; do
#              echo "Waiting SPA... $(date +%H:%M:%S)"
#              sleep 5
#            done
#          ' || { echo "Timeout"; docker compose -f refapp/docker-compose.yml ps; exit 1; }
#          echo "OpenMRS ready"

      # ────────────────────────────────────────────────
      # Java + Maven для обоих типов тестов
      # ────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven repository # Кэширование репозитория Maven для ускорения сборки
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Запуск тестов с фильтром по пакету
      - name: Run tests (${{ inputs.package }})
        env:
          # Передаём baseUrl через environment variable
          # Твой код в PlaywrightConfiguration.loadFromProperties() берёт из properties,
          # но проще и надёжнее передать через -D или env → адаптируй Config.getProperty()
          UI_BASE_URL: "http://localhost/openmrs/spa"
          # Если headless управляется через properties → можно добавить:
          HEADLESS: "true"
          # или другие: BROWSER=chrome, etc.
        run: |
          # Для api: только api-пакет
          # Для ui: только ui-пакет
          if [ "${{ inputs.package }}" = "api" ]; then
            mvn clean test -Dtest=api.** -DfailIfNoTests=false
          else
            mvn clean test -Dtest=ui.** -DfailIfNoTests=false
          fi

      # Swagger Coverage — только для API
      - name: Generate Swagger Coverage (API only)
        if: ${{ inputs.package == 'api' }}
        continue-on-error: true
        run: |
          curl -L https://github.com/viclovsky/swagger-coverage/releases/latest/download/swagger-coverage-commandline.zip -o sc.zip
          unzip sc.zip
          chmod +x swagger-coverage-commandline/bin/swagger-coverage-commandline
          ./swagger-coverage-commandline/bin/swagger-coverage-commandline \
            -s http://localhost/openmrs/ws/rest/v1/swagger.json \
            -i target/swagger-coverage-output || true

      - name: Upload Swagger Coverage (API)
        if: ${{ inputs.package == 'api' }}
        uses: actions/upload-artifact@v4
        with:
          name: swagger-coverage
          path: target/swagger-coverage-output/
          if-no-files-found: warn

      # Артефакты для всех (JUnit XML + любые html-отчёты)
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ inputs.package }}
          path: |
            target/surefire-reports/
            target/*.html
            target/swagger-coverage-output/
          if-no-files-found: warn
          retention-days: 7