name: OpenMRS App Stage

on:
  workflow_call:

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout (если нужны другие файлы — .env, скрипты и т.д.)
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create docker-compose.yml on the fly
        run: |
          cat > docker-compose.yml << 'EOF'
          services:
            gateway:
              image: openmrs/openmrs-reference-application-3-gateway:${TAG:-qa}
              restart: "unless-stopped"
              depends_on:
                - frontend
                - backend
              ports:
                - "80:80"

            frontend:
              image: openmrs/openmrs-reference-application-3-frontend:${TAG:-qa}
              restart: "unless-stopped"
              environment:
                SPA_PATH: /openmrs/spa
                API_URL: /openmrs
                SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost/"]
                timeout: 5s
              depends_on:
                - backend

            backend:
              image: openmrs/openmrs-reference-application-3-backend:${TAG:-qa}
              restart: "unless-stopped"
              depends_on:
                - db
              environment:
                OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
                OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
                OMRS_CONFIG_CREATE_TABLES: "true"
                OMRS_CONFIG_CONNECTION_SERVER: db
                OMRS_CONFIG_CONNECTION_DATABASE: openmrs
                OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER:-openmrs}
                OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:8080/openmrs"]
                timeout: 5s
              volumes:
                - openmrs-data:/openmrs/data

            db:
              image: mariadb:10.11.7
              restart: "unless-stopped"
              command: "mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci"
              healthcheck:
                test: "mysql --user=${OMRS_DB_USER:-openmrs} --password=${OMRS_DB_PASSWORD:-openmrs} --execute \"SHOW DATABASES;\""
                interval: 3s
                timeout: 1s
                retries: 5
              environment:
                MYSQL_DATABASE: openmrs
                MYSQL_USER: ${OMRS_DB_USER:-openmrs}
                MYSQL_PASSWORD: ${OMRS_DB_PASSWORD:-openmrs}
                MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openmrs}
              volumes:
                - db-data:/var/lib/mysql

          volumes:
            openmrs-data: {}
            db-data: {}
          EOF

      - name: Pull images
        run: docker compose pull --quiet || true

      - name: Start stack
        run: docker compose up -d

      - name: Wait for healthy
        run: |
          timeout 900s bash -c '
            until [ -z "$(docker compose ps --format json | jq -r ".[] | select(.State != \"healthy\" and .State != \"running\") | .Name")" ]; do
              echo "Waiting... $(date +%H:%M:%S)"
              sleep 10
            done
          ' || { echo "Timeout — some service not healthy"; exit 1; }

          echo "All services healthy"
          docker compose ps