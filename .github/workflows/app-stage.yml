name: OpenMRS App Stage

on:
  workflow_call:

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (для доступа к тестам и конфигам)
        uses: actions/checkout@v4

      - name: Clone OpenMRS Reference Application 3.x
        run: |
          git clone https://github.com/openmrs/openmrs-distro-referenceapplication.git openmrs-refapp
          cd openmrs-refapp

      - name: Pull images
        working-directory: openmrs-refapp
        run: docker compose pull --quiet || true

      - name: Start OpenMRS stack
        working-directory: openmrs-refapp
        run: docker compose up -d

