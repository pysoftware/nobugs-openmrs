name: OpenMRS CI (UI + API)

on:
  push:
    branches:
      - main
      - ci_cd
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ------------------ Java ------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}

      - name: Build project
        run: mvn -B clean install -DskipTests

      - name: Checkstyle
        run: mvn checkstyle:check
        continue-on-error: true

      # ------------------ Pre-seeded OpenMRS ------------------
      - name: Setup pre-seeded OpenMRS
        run: |
          mkdir -p preseeded-db
          if [ ! -f preseeded-db/dump.sql ]; then
            echo "Downloading pre-seeded database..."
            curl -sSL -o preseeded-db/dump.sql https://example.com/openmrs-dump.sql
          fi

          cat > setup-openmrs.sh <<'EOF'
          #!/bin/bash
          set -e
          DB_VOLUME="db-data"
          OPENMRS_VOLUME="openmrs-data"
          COMPOSE_FILE="docker-compose.yml"
          DB_PORT=3306
          OPENMRS_PORT=8080

          if [ ! "$(docker volume ls -q -f name=$DB_VOLUME)" ]; then
            echo "Создаём pre-seeded MariaDB том..."
            docker volume create $DB_VOLUME
            docker run --rm \
              -v $DB_VOLUME:/var/lib/mysql \
              -v $(pwd)/preseeded-db/dump.sql:/dump.sql \
              -e MYSQL_ROOT_PASSWORD=openmrs \
              mariadb:10.11.7 \
              bash -c "mysqld --initialize-insecure --datadir=/var/lib/mysql && \
                       mysqld_safe & sleep 10 && \
                       mysql -uroot -p\$MYSQL_ROOT_PASSWORD openmrs < /dump.sql && \
                       pkill mysqld"
          else
            echo "Том MariaDB уже существует, пропускаем инициализацию"
          fi

          if [ ! "$(docker volume ls -q -f name=$OPENMRS_VOLUME)" ]; then
            docker volume create $OPENMRS_VOLUME
          fi

          echo "Запускаем OpenMRS..."
          docker compose -f $COMPOSE_FILE up -d

          echo "Ждём пока OpenMRS будет доступен на http://localhost:$OPENMRS_PORT..."
          for i in {1..600}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:$OPENMRS_PORT/openmrs/spa || true)
            if [ "$STATUS" = "200" ]; then
              echo "OpenMRS готов!"
              exit 0
            fi
            echo "Waiting for OpenMRS..."
            sleep 60
          done
          echo "❌ OpenMRS не запустился"
          exit 1
          EOF

          chmod +x setup-openmrs.sh
          ./setup-openmrs.sh

      # ------------------ API Tests ------------------
      - name: Run API tests
        run: mvn test -Dtest=api.*Test

      - name: Upload API test logs
        uses: actions/upload-artifact@v4
        with:
          name: api-test-logs
          path: target/surefire-reports

      # ------------------ Swagger API coverage (optional) ------------------
      - name: Swagger API coverage
        run: |
          pip install schemathesis
          schemathesis run http://localhost:8080/openmrs/swagger.json

      # ------------------ UI Tests ------------------
      - name: Run UI tests
        run: mvn test -Dtest=ui.*Test

      - name: Upload UI test logs
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-logs
          path: target/surefire-reports

      # ------------------ Allure Report ------------------
      - name: Generate Allure report via Maven
        run: mvn allure:report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      # ------------------ Logs ------------------
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p logs
          docker logs openmrs > logs/openmrs.log || true
          ls -la target/surefire-reports >> logs/maven-surefire.txt

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs

