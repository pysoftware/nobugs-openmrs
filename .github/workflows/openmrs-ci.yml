name: OpenMRS CI (UI + API)

on:
  push:
    branches:
      - main
      - ci_cd
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ------------------ Java ------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}

      - name: Build project
        run: mvn -B clean install -DskipTests

      - name: Checkstyle
        run: mvn checkstyle:check
        continue-on-error: true

      # ------------------ Start OpenMRS Docker ------------------
      - name: Start OpenMRS
        run: |
          docker run -d --name openmrs -p 8080:8080 openmrs/openmrs-reference-application-distro

      - name: Wait for OpenMRS
        run: |
          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/openmrs/login.htm || true)
            if [ "$STATUS" = "200" ]; then
              echo "OpenMRS started"
              exit 0
            fi
            echo "Waiting for OpenMRS..."
            sleep 10
          done
          echo "OpenMRS failed to start"
          exit 1

      # ------------------ API Tests ------------------
      - name: Run API tests
        run: mvn test -Dtest=ApiTests

      - name: Upload API test logs
        uses: actions/upload-artifact@v4
        with:
          name: api-test-logs
          path: target/surefire-reports

      # ------------------ Swagger API coverage (optional) ------------------
      - name: Swagger API coverage
        run: |
          pip install schemathesis
          schemathesis run http://localhost:8080/openmrs/swagger.json

      # ------------------ UI Tests ------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: node-${{ hashFiles('**/package-lock.json') }}

      - name: Install UI dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run UI tests
        run: npx playwright test --workers=4

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report

      # ------------------ Allure Report ------------------
      - name: Generate Allure report via Maven
        run: mvn allure:report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      # ------------------ Logs ------------------
      - name: Collect logs
        if: failure()
        run: |
          mkdir -p logs
          docker logs openmrs > logs/openmrs.log || true
          ls -la target/surefire-reports >> logs/maven-surefire.txt

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs

