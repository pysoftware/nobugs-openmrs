name: OpenMRS CI (UI + API with preseeded DB)

on:
  push:
    branches:
      - main
      - ci_cd
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ------------------ Checkout repo ------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # ------------------ Java ------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}

      - name: Build project
        run: mvn -B clean install -DskipTests

      - name: Checkstyle
        run: mvn checkstyle:check
        continue-on-error: true

      # ------------------ Start OpenMRS with preseeded DB ------------------
      - name: Start OpenMRS
        run: |
          docker compose -f docker-compose.yml up -d --wait

      - name: Wait for OpenMRS ready
        run: |
          for i in {1..600}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/openmrs/spa/login.htm || true)
            if [ "$STATUS" = "200" ]; then
              echo "OpenMRS started"
              exit 0
            fi
            echo "Waiting for OpenMRS..."
            sleep 60
          done
          echo "OpenMRS failed to start"
          exit 1

      # ------------------ API Tests ------------------
      - name: Run API tests
        run: mvn test -Dtest=api.*Test

      - name: Upload API test logs
        uses: actions/upload-artifact@v4
        with:
          name: api-test-logs
          path: target/surefire-reports

      # ------------------ Swagger API coverage ------------------
      - name: Swagger API coverage
        run: |
          pip install schemathesis
          schemathesis run http://localhost:8080/openmrs/swagger.json

      # ------------------ UI Tests ------------------
      - name: Run UI tests
        run: mvn test -Dtest=ui.*Test

      - name: Upload UI test logs
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-logs
          path: target/surefire-reports

      # ------------------ Allure Report ------------------
      - name: Generate Allure report via Maven
        run: mvn allure:report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin

      # ------------------ Collect Docker logs ------------------
      - name: Collect OpenMRS logs
        if: failure()
        run: |
          mkdir -p logs
          docker compose logs --no-color > logs/openmrs-docker.log || true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs

