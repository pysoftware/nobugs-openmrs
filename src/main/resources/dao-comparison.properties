# Format: ApiResponseClass=DaoClass:field1=field1Dao,field2=field2Dao
# Maps API response fields to DAO fields for comparison

PersonUuidDao=PersonResponse:uuid=uuid

# Patient
PatientResponse=PatientDao:uuid=uuid,person.gender=gender,person.birthdate=birthdate,person.birthdateEstimated=birthdateEstimated,person.dead=dead,person.deathDate=deathDate,person.birthtime=birthtime,person.deathdateEstimated=deathdateEstimated
PatientIdentifierResponse=PatientIdentifierDao:uuid=uuid,identifier=identifier

# PatientIdentifierType
PatientIdentifierTypeResponse=PatientIdentifierTypeDao:uuid=uuid,name=name,description=description,format=format,formatDescription=formatDescription,validator=validator,locationBehavior=locationBehavior,uniquenessBehavior=uniquenessBehavior

# Location
LocationResponse=LocationDao:uuid=uuid,name=name,description=description,address1=address1,cityVillage=cityVillage,stateProvince=stateProvince,country=country,postalCode=postalCode,latitude=latitude,longitude=longitude,countyDistrict=countyDistrict

#Person
PersonResponse=PersonDao:uuid=uuid,gender=gender,birthdate=birthdate
PersonAddressResponse=PersonAddressDao:uuid=uuid,address1=address1,cityVillage=city_village,country=country,postalCode=postal_code